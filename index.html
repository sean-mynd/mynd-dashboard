<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

/* Login screen */
.login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
}
.login-box {
    background: #1e293b;
    border: 1px solid #475569;
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    text-align: center;
}
.login-box h1 {
    font-size: 1.4rem;
    color: #e2e8f0;
    margin-bottom: 8px;
}
.login-box .subtitle {
    color: #94a3b8;
    font-size: 0.85rem;
    margin-bottom: 28px;
}
.login-box input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #475569;
    border-radius: 8px;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 1rem;
    margin-bottom: 16px;
    outline: none;
}
.login-box input:focus {
    border-color: #38bdf8;
}
.login-box button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #38bdf8, #a78bfa);
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
}
.login-box button:hover {
    opacity: 0.9;
}
.login-box .error {
    color: #ef4444;
    font-size: 0.85rem;
    margin-top: 12px;
    display: none;
}
#dashboard-area { display: none; }
</style>
</head>

<div class="login-screen" id="loginScreen">

        <button onclick="checkPassword()">View Dashboard</button>
        <div class="error" id="errorMsg">Incorrect password. Please try again.</div>
    </div>
</div>

async function sha256(message) {
    const msgBuffer = new TextEncoder().encode(message);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

async function checkPassword() {
    const pwd = document.getElementById('pwdInput').value;
    const hash = await sha256(pwd);
    if (hash === HASH) {
        function extractBody(html) {
            const match = html.match(/<body[^>]*>([\\s\\S]*?)<\/body>/i);
            return match ? match[1] : html;
        }
        function extractStyle(html) {
            const match = html.match(/<style[^>]*>([\\s\\S]*?)<\/style>/i);
            return match ? match[1] : '';
        }
        function b64DecodeUTF8(b64) {
            const bytes = atob(b64);
            const arr = new Uint8Array(bytes.length);
            for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
            return new TextDecoder('utf-8').decode(arr);
        }

        const dashHTML = b64DecodeUTF8(DASH_B64);

        const styleEl = document.createElement('style');
        styleEl.textContent = extractStyle(dashHTML);
        document.head.appendChild(styleEl);

        document.getElementById('dashboard-area').innerHTML = extractBody(dashHTML);
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard-area').style.display = 'block';
    } else {
        document.getElementById('errorMsg').style.display = 'block';
    }
}
