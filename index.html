<title>Mynd Mushrooms — Dashboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

/* Login screen */
.login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
}
.login-box {
    background: #1e293b;
    border: 1px solid #475569;
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    text-align: center;
}
.login-box h1 {
    font-size: 1.4rem;
    color: #e2e8f0;
    margin-bottom: 8px;
}
.login-box .subtitle {
    color: #94a3b8;
    font-size: 0.85rem;
    margin-bottom: 28px;
}
.login-box input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #475569;
    border-radius: 8px;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 1rem;
    margin-bottom: 16px;
    outline: none;
}
.login-box input:focus {
    border-color: #38bdf8;
}
.login-box button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #38bdf8, #a78bfa);
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
}
.login-box button:hover {
    opacity: 0.9;
}
.login-box .error {
    color: #ef4444;
    font-size: 0.85rem;
    margin-top: 12px;
    display: none;
}
.tab-bar {
    display: flex;
    background: #1e293b;
    border-bottom: 1px solid #475569;
    padding: 0 24px;
}
.tab-btn {
    padding: 14px 24px;
    background: none;
    border: none;
    color: #94a3b8;
    font-size: 0.9rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
}
.tab-btn.active {
    color: #38bdf8;
    border-bottom-color: #38bdf8;
}
.tab-content { display: none; }
.tab-content.active { display: block; }

#dashboard-area { display: none; }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="loginScreen">
    <div class="login-box">
        <h1>Mynd Mushrooms</h1>
        <p class="subtitle">Meta Ads Dashboard — Apr 28, 2026</p>
        <input type="password" id="pwdInput" placeholder="Enter password" autocomplete="off">
        <button onclick="checkPassword()">View Dashboard</button>
        <div class="error" id="errorMsg">Incorrect password. Please try again.</div>
    </div>
</div>

<!-- DASHBOARD AREA (hidden until auth) -->
<div id="dashboard-area">
    <div class="tab-bar">
        <button class="tab-btn active" onclick="showTab('dashboard')">Full Dashboard</button>
        <button class="tab-btn" onclick="showTab('partner')">Partner Summary</button>
    </div>
    <div class="tab-content active" id="tab-dashboard"></div>
    <div class="tab-content" id="tab-partner"></div>
</div>

async function sha256(message) {
    const msgBuffer = new TextEncoder().encode(message);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

async function checkPassword() {
    const pwd = document.getElementById('pwdInput').value;
    const hash = await sha256(pwd);
    if (hash === HASH) {
        // Extract body content from full HTML pages
        function extractBody(html) {
            const match = html.match(/<body[^>]*>([\\s\\S]*?)<\/body>/i);
            return match ? match[1] : html;
        }
        function extractStyle(html) {
            const match = html.match(/<style[^>]*>([\\s\\S]*?)<\/style>/i);
            return match ? match[1] : '';
        }

        function b64DecodeUTF8(b64) {
            const bytes = atob(b64);
            const arr = new Uint8Array(bytes.length);
            for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
            return new TextDecoder('utf-8').decode(arr);
        }
        const dashHTML = b64DecodeUTF8(DASH_B64);
        const partnerHTML = b64DecodeUTF8(PARTNER_B64);

        // Inject styles
        const styleEl = document.createElement('style');
        styleEl.textContent = extractStyle(dashHTML);
        document.head.appendChild(styleEl);

        const styleEl2 = document.createElement('style');
        styleEl2.textContent = extractStyle(partnerHTML);
        styleEl2.id = 'partner-style';
        styleEl2.disabled = true;
        document.head.appendChild(styleEl2);

        document.getElementById('tab-dashboard').innerHTML = extractBody(dashHTML);
        document.getElementById('tab-partner').innerHTML = extractBody(partnerHTML);

        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard-area').style.display = 'block';
    } else {
        document.getElementById('errorMsg').style.display = 'block';
    }
}

function showTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

    if (tab === 'dashboard') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-dashboard').classList.add('active');
        document.body.style.background = '#0f172a';
    } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-partner').classList.add('active');
        document.body.style.background = '#ffffff';
    }
}

// Allow Enter key to submit
document.getElementById('pwdInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') checkPassword();
});
